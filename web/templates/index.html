<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TUNA – Digital Tuner</title>
    <link rel="stylesheet" href="/static/style.css" />
    <!-- PWA Metadata -->
    <link rel="manifest" href="/static/manifest.json" />
    <meta name="theme-color" content="#222222" />
    <link rel="icon" sizes="192x192" href="/static/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png" />

</head>
<body>
    <h1>🎵 TUNA – Digital Tuner</h1>

    <button onclick="startRecording()">Start Recording</button>
    <button onclick="stopRecording()">Stop Recording</button>

    <div class="feedback">
        <p id="feedback">Feedback: N/A</p>
        <p id="note">Closest Note: N/A</p>
        <p id="cents">Cents Difference: N/A</p>
        <p id="frequency">Detected Frequency: N/A</p>
    </div>

    <!-- Load frontend logic -->
    <script src="/static/js/tuner.js"></script>

    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('/static/service-worker.js')
            .then(() => console.log("✅ Service Worker registered"))
            .catch(err => console.log("❌ Service Worker failed", err));
        }
    </script>
</body>
</html>
